name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint sources (incl. bootstrap + integration scripts)
        run: shellcheck ss-easy lib/*.sh build.sh install.sh tests/integration/*.sh
      - name: Build and lint the bundle
        run: |
          bash build.sh
          shellcheck dist/ss-easy

  test:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run unit tests (incl. bootstrap.bats)
        run: bats tests/

  build:
    name: build bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and syntax-check
        run: |
          bash build.sh
          bash -n dist/ss-easy
          test -x dist/ss-easy

  # Guard against drift between the committed bootstrap checksum and the bundle.
  # `bash build.sh` is byte-reproducible, so a fresh build must hash to exactly
  # the value in checksums/bootstrap.sha256 (which install.sh verifies before
  # exec). If they differ, the published checksum is stale and every curl|bash
  # install would abort — fail CI here instead (Decision 9 / audit SS-M2). Also
  # asserts the build is deterministic by building twice and comparing.
  bundle-checksum:
    name: bundle checksum gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert dist/ss-easy matches committed bootstrap.sha256 (and is deterministic)
        run: |
          bash build.sh
          h1="$(sha256sum dist/ss-easy | awk '{print $1}')"
          bash build.sh
          h2="$(sha256sum dist/ss-easy | awk '{print $1}')"
          if [ "$h1" != "$h2" ]; then
            echo "ERROR: build.sh is not deterministic: $h1 != $h2" >&2
            exit 1
          fi
          committed="$(awk '{print $1; exit}' checksums/bootstrap.sha256)"
          if [ "$h1" != "$committed" ]; then
            echo "ERROR: dist/ss-easy hash does not match checksums/bootstrap.sha256." >&2
            echo "  built:     $h1" >&2
            echo "  committed: $committed" >&2
            echo "  Regenerate with: sha256sum dist/ss-easy | sed 's#dist/##' > checksums/bootstrap.sha256" >&2
            exit 1
          fi
          echo "OK: bundle hash matches committed bootstrap.sha256 ($h1)."

  # Fail if any git-tracked file matches a .gitignore pattern (artifact leak).
  # `git ls-files -ci --exclude-standard` lists tracked-but-ignored files; a
  # non-empty result means an ignored artifact (work/, tmp/, *.log, ...)
  # leaked into the repo. NOTE: `git check-ignore --stdin` is the WRONG tool here
  # — it silently passes already-tracked files, so the gate would always be green.
  gitignore-leak:
    name: gitignore-leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no .gitignore-tracked artifacts leaked
        run: |
          leaked="$(git ls-files -ci --exclude-standard)"
          if [ -n "$leaked" ]; then
            echo "ERROR: these tracked files match .gitignore (must not be committed):" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "OK: no .gitignore-tracked artifacts in the repo."

  # Tamper-detection: the bootstrap MUST refuse to execute a bundle whose SHA256
  # does not match the published checksum (Decision 9). Runs as root in a clean
  # container so the verify-before-exec path (not just the root guard) is hit.
  tampered-bundle:
    name: tampered-bundle abort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert bootstrap aborts on a tampered bundle
        run: |
          docker run --rm -v "$PWD":/src:ro debian:stable-slim bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq curl ca-certificates coreutils >/dev/null
            SS_EASY_SRC=/src bash /src/tests/integration/tampered-bundle.sh
          '

  # Full install -> user add -> list -> del -> uninstall lifecycle of the
  # assembled bundle on both distro families, with file-permission assertions.
  #
  # SYSTEMD-IN-DOCKER caveat: a plain container has no systemd as PID 1, so the
  # lifecycle script shims systemctl/firewall and asserts the GENERATED artifacts
  # (unit file, config.json, permissions) rather than a live `systemctl is-active`.
  # Runtime deps are pre-provisioned (on rhel the whiptail binary is in `newt`),
  # so pkg_ensure_runtime_deps is a verified no-op. The live SIP022/classic link
  # correctness through a real ssserver+sslocal proxy is proven by the `e2e` job.
  integration:
    name: integration (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable-slim, rockylinux:9]
    steps:
      - uses: actions/checkout@v4
      - name: Build the bundle
        run: bash build.sh
      - name: Lifecycle in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/src:ro "${{ matrix.image }}" bash -c '
            set -e
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl jq xz-utils ca-certificates openssl \
                iproute2 findutils passwd qrencode whiptail >/dev/null
            else
              dnf install -y -q epel-release >/dev/null
              # On rhel the whiptail CLI ships in the `newt` package. Do NOT
              # request `curl` (curl-minimal is preinstalled and conflicts);
              # --allowerasing keeps the transaction from aborting on any swap.
              dnf install -y -q --allowerasing jq xz tar findutils iproute \
                qrencode newt openssl shadow-utils >/dev/null
            fi
            SS_EASY_SRC=/src bash /src/tests/integration/lifecycle.sh
          '

  # E2E proxy smoke: stand up ssserver from a generated config and sslocal from
  # the generated ss:// link (same pinned ss-rust binary), then curl a target
  # THROUGH the proxy. Proves the link works end-to-end on both distro families
  # and for both the default SIP022 cipher and the classic fallback. No systemd.
  e2e:
    name: e2e proxy (${{ matrix.image }} / ${{ matrix.method }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable-slim, rockylinux:9]
        method: [2022-blake3-aes-256-gcm, chacha20-ietf-poly1305]
    steps:
      - uses: actions/checkout@v4
      - name: Proxy E2E in ${{ matrix.image }} (${{ matrix.method }})
        run: |
          docker run --rm -e E2E_METHOD="${{ matrix.method }}" \
            -v "$PWD":/src:ro "${{ matrix.image }}" bash -c '
            set -e
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq >/dev/null
              apt-get install -y -qq curl jq xz-utils ca-certificates openssl \
                findutils >/dev/null
            else
              # curl-minimal is preinstalled on rhel; do not request `curl`.
              dnf install -y -q --allowerasing jq xz tar findutils >/dev/null
            fi
            SS_EASY_SRC=/src bash /src/tests/integration/proxy-e2e.sh
          '
