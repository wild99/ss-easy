name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint sources (incl. bootstrap)
        run: shellcheck ss-easy lib/*.sh build.sh install.sh
      - name: Build and lint the bundle
        run: |
          bash build.sh
          shellcheck dist/ss-easy

  build:
    name: build bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and syntax-check
        run: |
          bash build.sh
          bash -n dist/ss-easy
          test -x dist/ss-easy

  # Guard against drift between the committed bootstrap checksum and the bundle.
  # `bash build.sh` is byte-reproducible, so a fresh build must hash to exactly
  # the value in checksums/bootstrap.sha256 (which install.sh verifies before
  # exec). If they differ, the published checksum is stale and every curl|bash
  # install would abort — fail CI here instead (Decision 9 / audit SS-M2). Also
  # asserts the build is deterministic by building twice and comparing.
  bundle-checksum:
    name: bundle checksum gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert dist/ss-easy matches committed bootstrap.sha256 (and is deterministic)
        run: |
          bash build.sh
          h1="$(sha256sum dist/ss-easy | awk '{print $1}')"
          bash build.sh
          h2="$(sha256sum dist/ss-easy | awk '{print $1}')"
          if [ "$h1" != "$h2" ]; then
            echo "ERROR: build.sh is not deterministic: $h1 != $h2" >&2
            exit 1
          fi
          committed="$(awk '{print $1; exit}' checksums/bootstrap.sha256)"
          if [ "$h1" != "$committed" ]; then
            echo "ERROR: dist/ss-easy hash does not match checksums/bootstrap.sha256." >&2
            echo "  built:     $h1" >&2
            echo "  committed: $committed" >&2
            echo "  Regenerate with: sha256sum dist/ss-easy | sed 's#dist/##' > checksums/bootstrap.sha256" >&2
            exit 1
          fi
          echo "OK: bundle hash matches committed bootstrap.sha256 ($h1)."

  # Fail if any git-tracked file matches a .gitignore pattern (artifact leak).
  # `git ls-files -ci --exclude-standard` lists tracked-but-ignored files; a
  # non-empty result means an ignored artifact (work/, tmp/, *.log, ...)
  # leaked into the repo. NOTE: `git check-ignore --stdin` is the WRONG tool here
  # — it silently passes already-tracked files, so the gate would always be green.
  gitignore-leak:
    name: gitignore-leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no .gitignore-tracked artifacts leaked
        run: |
          leaked="$(git ls-files -ci --exclude-standard)"
          if [ -n "$leaked" ]; then
            echo "ERROR: these tracked files match .gitignore (must not be committed):" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "OK: no .gitignore-tracked artifacts in the repo."
